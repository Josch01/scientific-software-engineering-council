name: Validate scientific software skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref 2026-11-02
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 ref 2026-11-02
        with:
          python-version: ${{ matrix.python }}
      - name: Static package validation
        run: python scripts/validate_skill.py
      - name: Deterministic skill tests
        run: python -m unittest discover -s tests -v
      - name: Router smoke test
        run: python scripts/route_task.py examples/seir_desktop_audit.json
